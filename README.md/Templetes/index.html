<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amma Restaurant — Order</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">
        <span class="brand-mark">அ</span>
        <span>
          <strong>Amma Restaurant</strong>
          <small>South Indian tiffin</small>
        </span>
      </a>
      <nav>
        <a class="active" href="index.html">Order</a>
        <a href="admin.html">Admin</a>
      </nav>
    </header>

    <main class="pos-layout">
      <section>
        <div class="section-head">
          <h1>Menu</h1>
          <p>Tap an item to add it to the cart and bill.</p>
        </div>
        <div id="menu-grid" class="menu-grid"></div>
      </section>

      <aside class="bill-panel" id="bill-panel">
        <div class="bill-inner">
          <h2>Your bill</h2>
          <p class="bill-meta" id="bill-meta"></p>
          <ul id="cart-lines" class="cart-lines"></ul>
          <div class="totals">
            <div><span>Subtotal</span><strong id="subtotal">₹0</strong></div>
            <div><span>GST (5%)</span><strong id="gst">₹0</strong></div>
            <div class="grand"><span>Total</span><strong id="total">₹0</strong></div>
          </div>
          <div class="bill-actions no-print">
            <button type="button" class="btn ghost" id="clear-cart">Clear cart</button>
            <button type="button" class="btn ghost" id="print-bill">Print</button>
            <button type="button" class="btn primary" id="pay-now">Pay now</button>
          </div>
        </div>
      </aside>
    </main>

    <div class="modal-backdrop" id="pay-modal" hidden>
      <div class="modal" role="dialog" aria-labelledby="pay-title">
        <h2 id="pay-title">Pay now</h2>
        <p id="pay-amount"></p>
        <img id="pay-qr" alt="UPI payment QR code" />
        <p class="hint">Scan with any UPI app, then confirm payment.</p>
        <div class="bill-actions">
          <button type="button" class="btn ghost" id="cancel-pay">Cancel</button>
          <button type="button" class="btn primary" id="confirm-pay">Payment received</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="js/storage.js"></script>
    <script src="js/pos.js"></script>
  </body>
</html>
